name: sh-marketing

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sh-marketing-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketing_os_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sh-marketing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketing_os_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sh-marketing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sh-marketing-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    name: sh_marketing_postgres_data
  redis_data:
    name: sh_marketing_redis_data

networks:
  sh-marketing-network:
    driver: bridge
    name: sh-marketing-network
