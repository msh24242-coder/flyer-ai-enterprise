services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: marketing-os-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketing_os_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - marketing-os-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketing_os_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: marketing-os-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - marketing-os-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  marketing-os-network:
    driver: bridge
